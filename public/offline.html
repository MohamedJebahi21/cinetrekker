<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#d91c32" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Offline | CineTrekker</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; color: #f7f7f8; background: radial-gradient(circle at top, rgba(217, 28, 50, .16), transparent 38%), #09090b; }
      main { width: min(100%, 34rem); border: 1px solid rgba(255,255,255,.12); border-radius: 1.25rem; padding: clamp(1.5rem, 5vw, 2.5rem); background: rgba(21, 21, 24, .92); box-shadow: 0 24px 80px rgba(0,0,0,.36); }
      .mark { color: #f13b4e; font-size: .78rem; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; }
      h1 { margin: .75rem 0; font-size: clamp(2rem, 7vw, 3rem); line-height: 1.02; letter-spacing: -.04em; }
      p { max-width: 44ch; color: #b8b8c1; line-height: 1.65; }
      .actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1.5rem; }
      a, button { min-height: 44px; border-radius: .7rem; padding: .72rem 1rem; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
      button { border: 0; background: #f7f7f8; color: #111114; }
      a { border: 1px solid rgba(255,255,255,.18); color: #f7f7f8; background: transparent; }
      button:focus-visible, a:focus-visible { outline: 3px solid #f13b4e; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">CineTrekker</div>
      <h1>You’re offline.</h1>
      <p>Reconnect to keep discovering titles, checking release dates, and syncing your personal activity. Private account data is never stored in CineTrekker’s offline cache.</p>
      <div class="actions">
        <button type="button" onclick="window.location.reload()">Try again</button>
        <a href="/">Return Home</a>
      </div>
    </main>
  </body>
</html>
