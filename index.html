<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <script>
      // Force dark mode - clear any stored theme preferences and ensure dark class
      (function () {
        try {
          // Clear stored theme preferences
          localStorage.removeItem('theme');
          localStorage.removeItem('cinetrekker:theme');
          
          // Force dark mode on root element
          var root = document.documentElement;
          root.classList.add('dark');
          root.setAttribute('data-theme', 'dark');
          root.style.colorScheme = 'dark';
        } catch (e) {
          // ignore - SSR or localStorage not available
        }
      })();
    </script>
    <script src="/loading.js"></script>
    <!-- Primary SEO Tags -->
    <title>CineTrekker | Track Movies & TV Shows - Your Personal Watchlist</title>
    <meta name="description" content="Discover, track, and organize your favorite movies and TV shows with CineTrekker. Create watchlists, mark watched, and explore filming locations.">
    <meta name="keywords" content="movie tracker, TV show tracker, watchlist, filming locations, cinema, movies, TV series, film tracking, TMDB">
    <meta name="author" content="CineTrekker" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://cinetrekker.vercel.app/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />

    <meta property="og:title" content="CineTrekker | Track Movies & TV Shows">

    <meta name="twitter:description" content="Discover movies, track your watchlist, and explore filming locations.">
    <meta name="twitter:image" content="https://cinetrekker.vercel.app/og-image.png" />

    <!-- PWA / Mobile -->
    <meta name="theme-color" content="#E50914" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CineTrekker" />
    
    <!-- Icons -->
    <link rel="icon" type="image/png" href="/ct-icon.png?v=4" />
    <link rel="apple-touch-icon" href="/ct-icon.png?v=4" />

    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://api.themoviedb.org">
    <link rel="preconnect" href="https://image.tmdb.org">
    <link rel="preconnect" href="https://wzlcekvieglnidfempap.supabase.co">
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "CineTrekker",
      "description": "Track movies and TV shows with personalized watchlists and filming location discovery",
      "url": "https://cinetrekker.vercel.app",
      "applicationCategory": "EntertainmentApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.5",
        "ratingCount": "1000"
      }

    <!-- Critical CSS (inline for performance) -->
    <style>
      /* Reset & Base Styles */
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; scroll-behavior: smooth; background: #f8fafc; color: #0f172a; }
      body { background: #f8fafc; color: #0f172a; overflow-x: hidden; line-height: 1.5; }
      html.dark, html.dark body { background: #050505; color: #ffffff; }
      
      /* App Shell Loading State */
      .app-shell {
        min-height: 100vh;
        background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
        opacity: 1;
        transition: opacity 0.3s ease-out;
      }
      html.dark .app-shell {
        background: linear-gradient(180deg, #050505 0%, #0a0a0a 100%);
      }
      
      .app-shell.loaded {
        opacity: 0;
        pointer-events: none;
      }
      
      /* Loading Header */
      .loading-header {
        height: 64px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        padding: 0 1rem;
        background: rgba(248,250,252,0.9);
        backdrop-filter: blur(10px);
        position: sticky;
        top: 0;
        z-index: 50;
      }
      html.dark .loading-header { background: rgba(0,0,0,0.8); }
      
      .loading-logo {
        width: 40px;
        height: 40px;
        background: linear-gradient(135deg, #E50914 0%, #c20812 100%);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 18px;
        color: white;
        box-shadow: 0 0 20px rgba(229, 9, 20, 0.3);
      }
      
      .loading-title {
        margin-left: 12px;
        font-weight: 700;
        font-size: 1.25rem;
        letter-spacing: -0.02em;
        color: #0f172a;
      }
      html.dark .loading-title { color: #ffffff; }
      
      /* Loading Content */
      .loading-content {
        max-width: 1400px;
        margin: 0 auto;
        padding: 2rem 1rem;
      }
      
      /* Skeleton Animation */
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      
      .skeleton {
        background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
        border-radius: 8px;
      }
      html.dark .skeleton {
        background: linear-gradient(90deg, #1a1a1a 25%, #2a2a2a 50%, #1a1a1a 75%);
      }
      
      /* Grid Layout */
      .loading-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1rem;
        margin-top: 2rem;
      }
      
      .card-skeleton {
        aspect-ratio: 2/3;
        border-radius: 12px;
      }
      
      .text-skeleton {
        height: 1.5rem;
        margin-bottom: 0.5rem;
        border-radius: 4px;
      }
      
      /* Responsive Breakpoints */
      @media (min-width: 480px) {
        .loading-grid { grid-template-columns: repeat(3, 1fr); }
      }
      
      @media (min-width: 768px) {
        .loading-grid { grid-template-columns: repeat(4, 1fr); gap: 1.25rem; }
        .loading-content { padding: 3rem 2rem; }
        .loading-header { padding: 0 2rem; }
      }
      
      @media (min-width: 1024px) {
        .loading-grid { grid-template-columns: repeat(5, 1fr); gap: 1.5rem; }
      }
      
      @media (min-width: 1400px) {
        .loading-grid { grid-template-columns: repeat(6, 1fr); }
      }
      
      /* Reduced Motion */
      @media (prefers-reduced-motion: reduce) {
        .skeleton { animation: none; background: #1a1a1a; }
        html { scroll-behavior: auto; }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <!-- App Shell Loading State -->
      <div class="app-shell" id="app-shell">
        <header class="loading-header">
          <div class="loading-logo" aria-hidden="true">CT</div>
          <div class="loading-title">CineTrekker</div>
        </header>
        
        <main class="loading-content">
          <div class="text-skeleton skeleton" style="width: 60%; max-width: 280px; height: 2rem; margin-bottom: 0.75rem;"></div>
          <div class="text-skeleton skeleton" style="width: 40%; max-width: 200px; height: 1rem; margin-bottom: 2rem;"></div>
          
          <div class="loading-grid" role="status" aria-label="Loading content">
            <div class="card-skeleton skeleton" aria-hidden="true"></div>
            <div class="card-skeleton skeleton" aria-hidden="true"></div>
            <div class="card-skeleton skeleton" aria-hidden="true"></div>
            <div class="card-skeleton skeleton" aria-hidden="true"></div>
            <div class="card-skeleton skeleton" aria-hidden="true"></div>
            <div class="card-skeleton skeleton" aria-hidden="true"></div>
          </div>
        </main>
      </div>
    </div>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
