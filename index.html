<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <!-- Primary SEO -->
    <title>CineTrekker — Track Your Movies & TV Shows</title>
    <meta name="description" content="Track TV shows and movies, manage your watchlist, mark episodes as watched, and discover what to watch next with CineTrekker.">
    <meta name="author" content="CineTrekker" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://cinetrekker.lovable.app" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cinetrekker.lovable.app" />
    <meta property="og:title" content="CineTrekker — Track Your Movies & TV Shows">
    <meta property="og:description" content="Track TV shows and movies, manage your watchlist, mark episodes as watched, and discover what to watch next.">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://cinetrekker.lovable.app" />
    <meta name="twitter:title" content="CineTrekker — Track Your Movies & TV Shows">

    <meta name="twitter:image" content="https://cinetrekker.lovable.app/og-image.png" />

    <meta name="theme-color" content="#E50914" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CineTrekker" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
