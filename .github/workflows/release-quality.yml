name: Release Quality Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, security, and browser quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Static and API-security checks
        run: npm run test:ci

      - name: Runtime dependency audit
        run: npm run audit:runtime

      - name: Build production bundle
        run: npm run build

      - name: Unit checks
        run: npm run test:unit

      - name: Production readiness safety checks
        run: npm run test:readiness

      - name: Public production readiness probe
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run readiness:public

      - name: Analytics privacy browser regressions
        run: npm run test:analytics-privacy

      - name: Chromium smoke checks
        run: npm run test:smoke

      - name: Mobile Safari search regression
        run: npm run test:e2e:mobile:search-regressions

      - name: Discovery layout and visual regression gates
        run: >-
          npx playwright test
          tests/discovery-layout-stability.spec.ts
          tests/visual-regression.spec.ts
          --project=chromium

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
