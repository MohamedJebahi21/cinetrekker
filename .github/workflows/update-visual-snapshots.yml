name: Update Visual Snapshots

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: visual-snapshot-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: Refresh Chromium visual baselines
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Regenerate visual baselines
        run: >-
          npx playwright test
          tests/visual-regression.spec.ts
          --project=chromium
          --update-snapshots

      - name: Open a review pull request for updated baselines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add tests/visual-regression.spec.ts-snapshots/

          if git diff --cached --quiet; then
            echo "No visual baseline changes were produced."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="visual-snapshots/${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git commit -m "test: refresh hosted visual baselines"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "test: refresh visual snapshots" \
            --body "Automated visual snapshot refresh. Review the generated baseline changes before merging."
