name: Scheduled Security Reviews

on:
  schedule:
    - cron: "0 6 1 * *"
    - cron: "0 7 1 1,4,7,10 *"
  workflow_dispatch:

jobs:
  monthly-quick-scan:
    if: github.event.schedule == '0 6 1 * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run test:security
      - run: node scripts/verify-security-config.mjs

  quarterly-deep-audit:
    if: github.event.schedule == '0 7 1 1,4,7,10 *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate || true
      - run: npm run build
      - run: npm run test:security
      - run: node scripts/verify-security-config.mjs
