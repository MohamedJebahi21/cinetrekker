name: i18n Coverage Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-i18n-keys:
    name: Verify i18n Keys
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify locale key coverage
        run: npm run i18n:verify

      - name: Generate coverage summary
        run: npm run i18n:report

      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: i18n-coverage-summary
          path: i18n-coverage-report.md
          if-no-files-found: error
