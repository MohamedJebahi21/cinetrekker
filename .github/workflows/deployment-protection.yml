name: Deployment Protection Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  secret-scanning:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for hardcoded API keys (Stripe)
        run: |
          if grep -r "sk_live_" src api 2>/dev/null; then
            echo "❌ ERROR: Found Stripe live API keys!"
            exit 1
          fi
          if grep -r "sk_test_" src api 2>/dev/null; then
            echo "⚠️ WARNING: Found Stripe test API keys (ensure they're not sensitive)"
          fi
          echo "✅ No hardcoded Stripe keys found"

      - name: Check for hardcoded JWT tokens
        run: |
          if grep -r "eyJ" src api 2>/dev/null | grep -v "node_modules\|dist\|build"; then
            echo "❌ ERROR: Found potential JWT tokens in code!"
            exit 1
          fi
          echo "✅ No hardcoded JWT tokens found"

      - name: Check for OpenAI API keys
        run: |
          if grep -r "sk_openai_\|sk-proj-\|openai.*key" src 2>/dev/null | grep -v "skip\|skeleton"; then
            echo "⚠️ WARNING: Found potential OpenAI keys"
            exit 1
          fi
          echo "✅ No hardcoded OpenAI keys found"

      - name: Check for TMDB API keys
        run: |
          # TMDB API keys are long hex strings
          if grep -rE "[a-f0-9]{32}" src 2>/dev/null | grep -v "node_modules\|dist\|*.test\|*.spec"; then
            echo "⚠️ WARNING: Found potential API key patterns"
          fi
          echo "✅ API key scan complete"

      - name: Verify .env files not committed
        run: |
          if git diff --cached --name-only | grep -E "\.env\." || \
             git log -1 --name-only | grep -E "\.env\."; then
            echo "❌ ERROR: Environment files detected in commit!"
            exit 1
          fi
          echo "✅ No environment files committed"

  build-validation:
    name: Validate Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript compilation
        run: npx tsc --noEmit --skipLibCheck

      - name: Check ESLint
        run: npm run lint || echo "⚠️ Lint warnings detected (non-blocking)"

  security-config:
    name: Validate Security Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify vercel.json exists
        run: |
          if [ ! -f "vercel.json" ]; then
            echo "❌ ERROR: vercel.json is missing!"
            exit 1
          fi
          echo "✅ vercel.json exists"

      - name: Validate vercel.json syntax
        run: |
          python3 -m json.tool vercel.json > /dev/null && \
          echo "✅ vercel.json is valid JSON" || \
          (echo "❌ ERROR: vercel.json has invalid syntax"; exit 1)

      - name: Check for security headers in vercel.json
        run: |
          HEADERS=$(grep -c "X-Content-Type-Options\|X-Frame-Options\|Strict-Transport-Security" vercel.json || true)
          if [ "$HEADERS" -lt 3 ]; then
            echo "⚠️ WARNING: Not all security headers found in vercel.json"
          fi
          echo "✅ Security headers check complete"

      - name: Verify CSP policy exists
        run: |
          if grep -q "Content-Security-Policy" vercel.json; then
            echo "✅ Content-Security-Policy header configured"
          else
            echo "⚠️ WARNING: CSP header not found in vercel.json"
          fi

      - name: Verify .gitignore includes .env files
        run: |
          if grep -q "\.env" .gitignore; then
            echo "✅ .env files are properly ignored"
          else
            echo "❌ ERROR: .env files not in .gitignore!"
            exit 1
          fi

  auth-validation:
    name: Validate Auth Implementation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for authErrorHandler implementation
        run: |
          if [ -f "src/lib/authErrorHandler.ts" ]; then
            echo "✅ authErrorHandler.ts exists"
          else
            echo "⚠️ WARNING: authErrorHandler.ts not found"
          fi

      - name: Check for generic error messages in Auth.tsx
        run: |
          if grep -q "sanitizeAuthError\|logAuthFailure" src/pages/Auth.tsx; then
            echo "✅ Auth.tsx uses sanitized error messages"
          else
            echo "⚠️ WARNING: Auth.tsx may not use error sanitization"
          fi

      - name: Verify no account enumeration leaks
        run: |
          cd src
          # Find all TypeScript files, excluding authErrorHandler, test files, and build dirs
          if find . -type f \( -name "*.ts" -o -name "*.tsx" \) \
             ! -path "*node_modules*" ! -path "*dist*" ! -path "*build*" \
             ! -name "*authErrorHandler*" ! -name "*.test.*" ! -name "*.spec.*" \
             -exec grep -l "User not found\|Incorrect password\|Email already exists" {} \; 2>/dev/null; then
            echo "❌ ERROR: Found potential account enumeration messages!"
            exit 1
          fi
          echo "✅ No obvious account enumeration messages found"

  dependency-check:
    name: Check Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        continue-on-error: true
        run: |
          echo "🔍 Checking for vulnerabilities..."
          npm audit --audit-level=moderate || {
            echo "⚠️ Vulnerabilities found. Review with: npm audit"
          }

      - name: Check for dompurify installation
        run: |
          if grep -q "isomorphic-dompurify" package.json; then
            echo "✅ DOMPurify is installed"
          else
            echo "⚠️ WARNING: DOMPurify not found in package.json"
          fi

  rate-limiting-check:
    name: Validate Rate Limiting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for rate limiting middleware
        run: |
          if [ -f "api/_lib/rateLimitMiddleware.ts" ]; then
            echo "✅ Rate limiting middleware exists"
          else
            echo "⚠️ WARNING: Rate limiting middleware not found"
          fi

      - name: Check search debounce value
        run: |
          if grep -q "debounceMs = 500\|debounceMs = 500" src/hooks/*.ts; then
            echo "✅ Search debounce is set to 500ms"
          else
            echo "⚠️ WARNING: Search debounce may not be 500ms"
          fi

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [secret-scanning, build-validation, security-config, auth-validation, dependency-check, rate-limiting-check]
    if: always()
    steps:
      - name: Check job status
        run: |
          if [ "${{ needs.secret-scanning.result }}" != "success" ] || \
             [ "${{ needs.build-validation.result }}" != "success" ] || \
             [ "${{ needs.security-config.result }}" != "success" ]; then
            echo "❌ Some checks failed. Please review above."
            exit 1
          fi
          echo "✅ All critical checks passed!"
          echo ""
          echo "Deployment Protection Summary:"
          echo "✅ No hardcoded secrets found"
          echo "✅ Build validates successfully"
          echo "✅ Security configuration verified"
          echo "✅ Auth implementation validated"
          echo "✅ Dependencies checked"
          echo "✅ Rate limiting configured"
