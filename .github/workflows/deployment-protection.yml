name: Deployment Protection Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  secret-scanning:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-validation:
    name: Validate Build and Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Run API security tests
        run: npm run test:security

      - name: Lint
        run: npm run lint

      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit

      - name: Run mobile search regression tests
        run: npm run test:e2e:mobile:search-regressions

  dependency-check:
    name: Runtime Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

  security-config:
    name: Verify Headers and CSP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify security headers
        run: node scripts/verify-security-config.mjs

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [secret-scanning, build-validation, dependency-check, security-config]
    if: always()
    steps:
      - name: Check job status
        run: |
          if [ "${{ needs.secret-scanning.result }}" != "success" ] || \
             [ "${{ needs.build-validation.result }}" != "success" ] || \
             [ "${{ needs.dependency-check.result }}" != "success" ] || \
             [ "${{ needs.security-config.result }}" != "success" ]; then
            echo "One or more deployment protection checks failed."
            exit 1
          fi
          echo "All deployment protection checks passed."
