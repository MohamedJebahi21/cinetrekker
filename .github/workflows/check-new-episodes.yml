name: Check New Episodes (Background Job)

on:
  schedule:
    # Runs daily at 3:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  check-episodes:
    runs-on: ubuntu-latest
    
    steps:
      - name: Call Supabase Edge Function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Call the deployed check-new-episodes edge function
          response=$(curl -X POST \
            "${SUPABASE_URL}/functions/v1/check-new-episodes" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -w "\n%{http_code}" \
            -s)
          
          http_code=$(echo "$response" | tail -n 1)
          body=$(echo "$response" | sed '$d')
          
          echo "Response: $body"
          echo "Status: $http_code"
          
          if [ "$http_code" -ne 200 ]; then
            echo "❌ Background job failed with status $http_code"
            exit 1
          fi

          node -e "const body = process.argv[1]; let parsed; try { parsed = JSON.parse(body); } catch { console.error('❌ Invalid JSON response from check-new-episodes'); process.exit(1); } if (typeof parsed !== 'object' || parsed === null || parsed.ok !== true) { console.error('❌ check-new-episodes did not report ok=true'); process.exit(1); } if (!Object.prototype.hasOwnProperty.call(parsed, 'processedCount') && !Object.prototype.hasOwnProperty.call(parsed, 'processedTitles')) { console.error('❌ Missing processed count field in response'); process.exit(1); } console.log('✅ check-new-episodes returned valid payload');" "$body"
          
          echo "✅ Background job completed successfully"